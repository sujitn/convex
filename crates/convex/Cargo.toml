[package]
name = "convex"
description = "Convex fixed income analytics — single-import facade."
# Not published: the `convex` name on crates.io belongs to an unrelated project.
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["finance", "fixed-income", "bonds", "pricing", "quantitative"]
categories = ["finance"]

[features]
schemars = ["dep:schemars", "convex-core/schemars", "convex-analytics/schemars", "convex-portfolio/schemars"]

[dependencies]
convex-core = { workspace = true }
convex-math = { workspace = true }
convex-curves = { workspace = true }
convex-bonds = { workspace = true }
convex-rates = { workspace = true }
convex-credit = { workspace = true }
convex-analytics = { workspace = true }
convex-portfolio = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
schemars = { version = "1.2", optional = true }

[dev-dependencies]
