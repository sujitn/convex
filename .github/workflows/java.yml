name: Java bindings

on:
  push:
    branches: [main]
    paths:
      - 'bindings/java/**'
      - 'crates/convex-ffi/**'
      - 'crates/convex-analytics/**'
      - 'crates/convex-bonds/**'
      - 'crates/convex-core/**'
      - 'crates/convex-curves/**'
      - 'crates/convex-math/**'
      - 'crates/convex/**'
      - 'crates/convex-rates/**'
      - 'crates/convex-credit/**'
      - 'crates/convex-portfolio/**'
      - 'tests/fixtures/library/**'
      - 'tests/scripts/library_parity.py'
      - 'tests/scripts/library_operations_parity.py'
      - 'tests/scripts/library_cash_parity.py'
      - 'tools/library/api-capabilities.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/java.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bindings/java/**'
      - 'crates/convex-ffi/**'
      - 'crates/convex-analytics/**'
      - 'crates/convex-bonds/**'
      - 'crates/convex-core/**'
      - 'crates/convex-curves/**'
      - 'crates/convex-math/**'
      - 'crates/convex/**'
      - 'crates/convex-rates/**'
      - 'crates/convex-credit/**'
      - 'crates/convex-portfolio/**'
      - 'tests/fixtures/library/**'
      - 'tests/scripts/library_parity.py'
      - 'tests/scripts/library_operations_parity.py'
      - 'tests/scripts/library_cash_parity.py'
      - 'tools/library/api-capabilities.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/java.yml'

# Build + test only; no repo writes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux x86_64 build + test. The release workflow extends this into a full
  # OS/arch matrix and assembles every cdylib into the natives jar.
  verify:
    name: Build native + mvn verify (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `excel` profile = panic=unwind; see [profile.excel] in Cargo.toml.
      - name: Build convex-ffi cdylib
        run: cargo build --locked -p convex-ffi --profile excel -p convex --lib --example library_workflow --features convex/schemars

      - name: Build supplemental native operation consumer
        run: cargo build --locked --profile excel -p convex --example library_operations --features schemars

      - name: Build native full cash quotation consumer
        run: cargo build --locked --profile excel -p convex --example library_cash --features schemars

      - name: Stage native library
        run: |
          dest=bindings/java/src/main/resources/native/linux-x86_64
          mkdir -p "$dest"
          cp target/excel/libconvex_ffi.so "$dest/"

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Generate fresh native adapter expectations
        run: python3 tests/scripts/library_parity.py prepare --binary target/excel/examples/library_workflow --output bindings/java/target/library-parity.json

      - name: Generate fresh native operation adapter expectations
        run: python3 tests/scripts/library_operations_parity.py prepare --binary target/excel/examples/library_operations --output bindings/java/target/library-operations-parity.json

      - name: Generate fresh native full cash adapter expectations
        run: python3 tests/scripts/library_cash_parity.py prepare --binary target/excel/examples/library_cash --output bindings/java/target/library-cash-parity.json

      - name: Maven verify
        run: mvn -B -f bindings/java/pom.xml verify
