name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  assurance:
    name: Bounded Rust Assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check dependency direction inventory and quantitative pins
        run: python3 tools/assurance/check.py

      - name: Check explicit change impact against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/assurance/check.py --base "$BASE_SHA"

      - name: Prove assurance rejects bypass mutations
        run: python3 -m unittest discover -s tools/assurance -p "test_*.py"

      - name: Prove library coverage rejects incomplete and declaration-only support
        run: python3 -m unittest discover -s tools/library -p "test_*.py"

      - name: Check independent fixed-365 short-bill reference bytes
        run: python3 tests/scripts/simple_bill_reference.py check

      - name: Reject unsupported long-bill proxies and cash overflow
        run: cargo test --locked -p convex-analytics --test simple_bill_yield

      - name: Check independent bill object conversion references
        run: python3 tests/scripts/bill_methods_reference.py check

      - name: Check exact bill rate-pole references
        run: python3 tests/scripts/bill_methods_boundary_reference.py check

      - name: Exercise checked bill object admission and units
        run: cargo test --locked -p convex --test bill_methods

      - name: Exercise checked bill conversions through the standalone facade
        run: cargo run --locked -p convex --example bill_methods

      - name: Exercise checked bill conversions without default features
        run: cargo run --locked -p convex --example bill_methods --no-default-features

      - name: Exercise checked bill conversions with schema features
        run: cargo run --locked -p convex --example bill_methods --features schemars

      - name: Check independent zero-coupon cash and rate references
        run: python3 tests/scripts/zero_methods_reference.py check

      - name: Exercise checked zero-coupon pricing and yield methods
        run: cargo test --locked -p convex --test zero_methods

      - name: Exercise checked zero-coupon methods through the facade
        run: cargo run --locked -p convex --example zero_methods

      - name: Exercise checked zero-coupon methods without default features
        run: cargo run --locked -p convex --example zero_methods --no-default-features

      - name: Exercise checked zero-coupon methods with schema features
        run: cargo run --locked -p convex --example zero_methods --features schemars

      - name: Check direct zero-coupon metadata declarations
        run: python3 tests/scripts/zero_terms_reference.py check

      - name: Check exact zero-coupon ingress boundaries
        run: python3 tests/scripts/zero_terms_boundary_reference.py check

      - name: Exercise lossless zero-coupon metadata and rejections
        run: cargo test --locked -p convex --test zero_terms

      - name: Exercise lossless zero-coupon terms through the facade
        run: cargo run --locked -p convex --example zero_terms

      - name: Exercise lossless zero-coupon terms without default features
        run: cargo run --locked -p convex --example zero_terms --no-default-features

      - name: Exercise lossless zero-coupon terms with schema features
        run: cargo run --locked -p convex --example zero_terms --features schemars

      - name: Check independently derived portable numerical references
        run: python3 tests/scripts/portable_math_reference.py check

      - name: Exercise shared portable numerical kernels
        run: cargo test --locked -p convex --test portable_math

      - name: Exercise portable numerical kernels through the standalone consumer
        run: cargo run --locked -p convex --example portable_math

      - name: Exercise portable numerical kernels without default features
        run: cargo run --locked -p convex --example portable_math --no-default-features

      - name: Exercise portable numerical kernels with schema features
        run: cargo run --locked -p convex --example portable_math --features schemars

      - name: Reject retired callable WASM convenience inputs
        run: cargo test --locked -p convex-wasm --test optional_retirement
      - name: Check retired convenience output and schema contracts
        run: cargo test --locked -p convex-ffi --test yas_output_retirement
      - name: Check actual WASM ingress field admission
        run: cargo test --locked -p convex-wasm --lib ingress::tests
      - name: Check WASM numeric inputs and unit ownership
        run: cargo test --locked -p convex-wasm --lib checked_inputs_tests

      - name: Qualify supplied native primitives rust-default-0
        run: cargo test --locked -p convex-core --test cashflow_primitives

      - name: Qualify supplied native primitives rust-default-1
        run: cargo test --locked -p convex --test native_primitives

      - name: Qualify supplied native primitives rust-default-consumer
        run: cargo run --locked -p convex --example native_primitives

      - name: Qualify supplied native primitives rust-no-default-0
        run: cargo test --locked -p convex-core --test cashflow_primitives --no-default-features

      - name: Qualify supplied native primitives rust-no-default-1
        run: cargo test --locked -p convex --test native_primitives --no-default-features

      - name: Qualify supplied native primitives rust-no-default-consumer
        run: cargo run --locked -p convex --example native_primitives --no-default-features

      - name: Qualify supplied native primitives rust-schemars-0
        run: cargo test --locked -p convex-core --test cashflow_primitives --features schemars

      - name: Qualify supplied native primitives rust-schemars-1
        run: cargo test --locked -p convex --test native_primitives --features schemars

      - name: Qualify supplied native primitives rust-schemars-consumer
