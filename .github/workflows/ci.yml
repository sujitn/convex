name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  assurance:
    name: Bounded Rust Assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check dependency direction inventory and quantitative pins
        run: python3 tools/assurance/check.py

      - name: Check explicit change impact against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/assurance/check.py --base "$BASE_SHA"

      - name: Prove assurance rejects bypass mutations
        run: python3 -m unittest discover -s tools/assurance -p "test_*.py"

      - name: Prove library coverage rejects incomplete and declaration-only support
        run: python3 -m unittest discover -s tools/library -p "test_*.py"

      - name: Exercise standalone public APIs with default features
        run: cargo run --locked -p convex --example inventory_probe

      - name: Exercise standalone public APIs without default features
        run: cargo run --locked -p convex --example inventory_probe --no-default-features

      - name: Exercise standalone public APIs with schema features
        run: cargo run --locked -p convex --example inventory_probe --features schemars

      - name: Check standalone library failures properties and ABI fuzzing
        run: cargo test --locked -p convex-math -p convex-core -p convex-ffi

      - name: Exercise shared cashflow primitives through the standalone facade
        run: cargo run --locked -p convex --example cashflow_primitives

      - name: Exercise shared cashflow primitives without default features
        run: cargo run --locked -p convex --example cashflow_primitives --no-default-features

      - name: Exercise shared cashflow primitives with schema features
        run: cargo run --locked -p convex --example cashflow_primitives --features schemars

      - name: Exercise checked curve contracts through the standalone facade
        run: cargo run --locked -p convex --example curve_contracts

      - name: Exercise checked curve contracts without default features
        run: cargo run --locked -p convex --example curve_contracts --no-default-features

      - name: Exercise checked curve contracts with schema features
        run: cargo run --locked -p convex --example curve_contracts --features schemars

      - name: Exercise curve numerics and transformations through the standalone facade
        run: cargo run --locked -p convex --example curve_numerics

      - name: Exercise curve numerics without default features
        run: cargo run --locked -p convex --example curve_numerics --no-default-features

      - name: Exercise curve numerics with schema features
        run: cargo run --locked -p convex --example curve_numerics --features schemars

      - name: Exercise shared supplied bond quotes through the standalone facade
        run: cargo run --locked -p convex --example bond_quotes

      - name: Exercise shared bond quotes without default features
        run: cargo run --locked -p convex --example bond_quotes --no-default-features

      - name: Exercise shared bond quotes with schema features
        run: cargo run --locked -p convex --example bond_quotes --features schemars

      - name: Run supplied bond terms
        run: cargo run --locked -p convex --example bond_contracts

      - name: Run supplied bond terms with minimal features
        run: cargo run --locked -p convex --example bond_contracts --no-default-features

      - name: Run supplied bond terms with schema support
        run: cargo run --locked -p convex --example bond_contracts --features schemars

      - name: Run supplied optional bond models
        run: cargo run --locked -p convex --example optional_bonds

      - name: Run supplied optional bond models with minimal features
        run: cargo run --locked -p convex --example optional_bonds --no-default-features

      - name: Run supplied optional bond models with schema features
        run: cargo run --locked -p convex --example optional_bonds --features schemars

      - name: Check supplied rates contract fixtures and fixing failures
        run: cargo test --locked -p convex-rates

      - name: Check bounded rates source and tests
        run: cargo clippy --locked -p convex-rates --all-targets -- -D warnings

      - name: Run supplied rates contracts
        run: cargo run --locked -p convex --example rates_contracts

      - name: Run supplied rates contracts with minimal features
        run: cargo run --locked -p convex --example rates_contracts --no-default-features

      - name: Run supplied rates contracts with schema features
        run: cargo run --locked -p convex --example rates_contracts --features schemars

      - name: Check independent supplied swap valuation fixtures
        run: python3 tests/scripts/swap_valuation_reference.py check

      - name: Check native dependent swap curve fitting
        run: cargo test --locked -p convex-analytics --test swap_calibration

      - name: Check swap prefixes curve composition and engine delegation
        run: cargo test --locked -p convex-core --test overnight_prefix -p convex-curves --test product_composition -p convex-engine --test swap_curves

      - name: Run supplied swap valuation and calibration
        run: cargo run --locked -p convex --example swap_valuation

      - name: Run supplied swap valuation with minimal features
        run: cargo run --locked -p convex --example swap_valuation --no-default-features

      - name: Run supplied swap valuation with schema features
        run: cargo run --locked -p convex --example swap_valuation --features schemars

      - name: Check minimum pure feature combination
        run: cargo check --locked -p convex -p convex-core -p convex-math -p convex-curves -p convex-bonds -p convex-rates -p convex-credit -p convex-analytics -p convex-portfolio --no-default-features

      - name: Check supplied CDS contracts valuation and conversion
        run: cargo test --locked -p convex-credit

      - name: Check bounded CDS source and tests
        run: cargo clippy --locked -p convex-credit --all-targets -- -D warnings

      - name: Verify the complete original ISDA grid and actual model capture
        run: python3 tests/scripts/isda_cds_compare.py check

      - name: Run supplied CDS valuation
        run: cargo run --locked -p convex --example cds_valuation

      - name: Run supplied CDS valuation with minimal features
        run: cargo run --locked -p convex --example cds_valuation --no-default-features

      - name: Run supplied CDS valuation with schema features
        run: cargo run --locked -p convex --example cds_valuation --features schemars

      - name: Check full supplied credit calibration and risk inputs
        run: cargo test --locked -p convex-analytics --test credit_calibration

      - name: Verify original credit calibration capture and declared bounds
        run: python3 tests/scripts/isda_credit_compare.py check

      - name: Run supplied credit calibration and signed risk
        run: cargo run --locked -p convex --example credit_calibration

      - name: Run supplied credit calibration with minimal features
        run: cargo run --locked -p convex --example credit_calibration --no-default-features

      - name: Run supplied credit calibration with schema features
        run: cargo run --locked -p convex --example credit_calibration --features schemars

      - name: Check actual futures reference import replay and input gates
        run: cargo test --locked -p convex-analytics -p convex-ports -p convex-ext-file -p convex-ext-redb --test futures_reference

      - name: Check futures input sources and dedicated tests
        run: cargo clippy --locked -p convex-analytics -p convex-ports -p convex-ext-file -p convex-ext-redb --test futures_reference --all-features -- -D warnings

      - name: Run archived actual futures reference consumer
        run: cargo run --locked -p convex --example futures_reference

      - name: Run futures reference consumer with minimal features
        run: cargo run --locked -p convex --example futures_reference --no-default-features

      - name: Run futures reference consumer with schema features
        run: cargo run --locked -p convex --example futures_reference --features schemars

      - name: Check full futures cash carry settlement and remaining-rate risk
        run: cargo test --locked -p convex-analytics --test futures_valuation

      - name: Check futures valuation source and dedicated tests
        run: cargo clippy --locked -p convex-analytics --test futures_valuation --all-features -- -D warnings

      - name: Run supplied futures valuation consumer
        run: cargo run --locked -p convex --example futures_valuation

      - name: Run futures valuation consumer with minimal features
        run: cargo run --locked -p convex --example futures_valuation --no-default-features

      - name: Run futures valuation consumer with schema features
        run: cargo run --locked -p convex --example futures_valuation --features schemars

      - name: Check independent mixed rate calibration references
        run: python3 tests/scripts/rate_calibration_reference.py check

      - name: Check complete original rate helpers and dependent rebuilds
        run: cargo test --locked -p convex-analytics --test rate_calibration

      - name: Check mixed rate calibration source and dedicated tests
        run: cargo clippy --locked -p convex-analytics --test rate_calibration --all-features -- -D warnings

      - name: Check required curve rates and numerical suites
        run: cargo test --locked -p convex-curves -p convex-rates -p convex-math

      - name: Run complete mixed rate calibration consumer
        run: cargo run --locked -p convex --example rate_calibration

      - name: Run mixed rate calibration with minimal features
        run: cargo run --locked -p convex --example rate_calibration --no-default-features

      - name: Run mixed rate calibration with schema features
        run: cargo run --locked -p convex --example rate_calibration --features schemars

      - name: Check all library feature combination
        run: cargo test --locked -p convex-math -p convex-core -p convex-ffi --all-features

      - name: Check independent cash curve references
        run: python3 tests/scripts/cash_calibration_reference.py check

      - name: Check full original cash helpers and dependency rebuilds
        run: cargo test --locked -p convex-analytics --test cash_calibration

      - name: Check bounded cash curve source and dedicated tests
        run: cargo clippy --locked -p convex-curves -p convex-credit -p convex-analytics --all-targets --all-features -- -D warnings

      - name: Check required cash curve analytics and credit suites
        run: cargo test --locked -p convex-curves -p convex-analytics -p convex-credit

      - name: Run full cash curve and dated repo carry consumer
        run: cargo run --locked -p convex --example cash_calibration

      - name: Run cash curve consumer with minimal features
        run: cargo run --locked -p convex --example cash_calibration --no-default-features

      - name: Run cash curve consumer with schema features
        run: cargo run --locked -p convex --example cash_calibration --features schemars

      - name: Check calibration failure and repricing contracts
        run: cargo test --locked -p convex-curves -p convex-bonds -p convex-analytics

      - name: Check independent full cash signed risk references
        run: python3 tests/scripts/quote_risk_reference.py check

      - name: Check full native signed quote risk and dependent rebuilding
        run: cargo test --locked -p convex-analytics --test quote_risk

      - name: Check expected portfolio coverage and pinned FX conversion
        run: cargo test --locked -p convex-portfolio --test signed_risk

      - name: Check independent complete cash workflow references
        run: python3 tests/scripts/standalone_reference.py check

      - name: Check supplied inverse cashflows scenario and native model guards
        run: cargo test --locked -p convex-analytics --test standalone_workflow

      - name: Check independent exact lifecycle reference
        run: python3 tests/scripts/lifecycle_reference.py check

      - name: Check native lifecycle boundary ordering and settlement stages
        run: cargo test --locked -p convex-analytics -p convex --test lifecycle

      - name: Check original lifecycle product suites
        run: cargo test --locked -p convex-bonds -p convex-rates -p convex-credit -p convex-analytics

      - name: Exercise pure lifecycle facade with default features
        run: cargo run --locked -p convex --example lifecycle

      - name: Exercise pure lifecycle facade without default features
        run: cargo run --locked -p convex --example lifecycle --no-default-features

      - name: Exercise pure lifecycle facade with schema features
        run: cargo run --locked -p convex --example lifecycle --features schemars

      - name: Lint original core lifecycle schedule helpers
        run: cargo clippy --locked -p convex-core --lib --all-features -- -D warnings

      - name: Lint native lifecycle selectors and complete pure consumers
        run: cargo clippy --locked -p convex-bonds -p convex-rates -p convex-credit -p convex-analytics -p convex --all-targets --all-features -- -D warnings

      - name: Check complete standalone mixed book and missing coverage
        run: cargo test --locked -p convex --test standalone_book

      - name: Check required standalone and original product suites
        run: cargo test --locked -p convex -p convex-analytics -p convex-rates -p convex-credit

      - name: Run full supplied quotes to mixed book consumer
        run: cargo run --locked -p convex --example standalone_book

      - name: Run mixed book consumer with minimal features
        run: cargo run --locked -p convex --example standalone_book --no-default-features

      - name: Run mixed book consumer with schema features
        run: cargo run --locked -p convex --example standalone_book --features schemars

      - name: Check every mandatory library surface and explicit capability gap
        run: python3 tools/library/api.py

      - name: Check complete raw native JSON C MCP and WASM adapter parity
        run: cargo test --locked -p convex --all-features --test library -p convex-ffi --test library -p convex-mcp --test library -p convex-wasm --test library

      - name: Check existing client contracts and full adapter suites
        run: cargo test --locked -p convex-ffi -p convex-wasm -p convex-mcp

      - name: Run supplied library requests with default features
        run: cargo run --locked -p convex --example library_workflow

      - name: Run supplied library requests with minimal features
        run: cargo run --locked -p convex --example library_workflow --no-default-features

      - name: Run supplied library requests with schema support
        run: cargo run --locked -p convex --example library_workflow --features schemars

      - name: Create isolated schema test environment
        run: python3 -m venv /tmp/convex-library-schema

      - name: Install pinned schema test tooling
        run: /tmp/convex-library-schema/bin/python -m pip install -r tools/library/requirements-schema.txt

      - name: Validate actual generated schema against full requests and rejected mutations
        run: /tmp/convex-library-schema/bin/python tests/scripts/library_schema.py --binary target/debug/examples/library_workflow

      - name: Check supplemental operation requests preserve original input corpus
        run: python3 tests/scripts/library_operations_inputs.py

      - name: Check exact conversion view and bucket native JSON C MCP WASM operations
        run: cargo test --locked -p convex --all-features --test library_operations -p convex-ffi --test library_operations -p convex-mcp --test library_operations -p convex-wasm --test library_operations

      - name: Run exact supplied operations with default features
        run: cargo run --locked -p convex --example library_operations

      - name: Run exact supplied operations with minimal features
        run: cargo run --locked -p convex --example library_operations --no-default-features

      - name: Run exact supplied operations with schema support
        run: cargo run --locked -p convex --example library_operations --features schemars

      - name: Validate exact generated schema against supplemental operations
        run: /tmp/convex-library-schema/bin/python tests/scripts/library_operations_schema.py --binary target/debug/examples/library_operations

      - name: Verify declared independent full cash quotation controls
        run: python3 tests/scripts/cash_quotation_reference.py

      - name: Check full cash quotation and government spread native JSON C MCP WASM routes
        run: cargo test --locked -p convex --all-features --test library_cash -p convex-ffi --test library_cash -p convex-mcp --test library_cash -p convex-wasm --test library_cash

      - name: Run full cash quotation consumer with default features
        run: cargo run --locked -p convex --example library_cash

      - name: Run full cash quotation consumer with minimal features
        run: cargo run --locked -p convex --example library_cash --no-default-features

      - name: Run full cash quotation consumer with schema support
        run: cargo run --locked -p convex --example library_cash --features schemars

      - name: Validate actual full cash quotation schema
        run: /tmp/convex-library-schema/bin/python tests/scripts/library_cash_schema.py --binary target/debug/examples/library_cash

      - name: Check complete supplied rate-helper inputs
        run: python3 tests/scripts/library_rate_helpers_inputs.py

      - name: Check complete supplied CDS-helper inputs
        run: python3 tests/scripts/library_credit_helpers_inputs.py

      - name: Check complete supplied cash-helper inputs
        run: python3 tests/scripts/library_cash_helpers_inputs.py

      - name: Check predeclared workout references and complete supplied inputs
        run: |
          python3 tests/scripts/workout_quotation_reference.py check
          python3 tests/scripts/library_workout_inputs.py

      - name: Check full workout native guards and JSON C MCP WASM reachability
        run: cargo test --locked -p convex-analytics --all-features --test workout_quotation -p convex --test library_workout -p convex-ffi --test library_workout -p convex-mcp --test library_workout -p convex-wasm --test library_workout

      - name: Run complete workout consumer with default features
        run: cargo run --locked -p convex --example library_workout

      - name: Run complete workout consumer with minimal features
        run: cargo run --locked -p convex --example library_workout --no-default-features

      - name: Run complete workout consumer with schema support
        run: cargo run --locked -p convex --example library_workout --features schemars

      - name: Validate actual full workout schema
        run: /tmp/convex-library-schema/bin/python tests/scripts/library_workout_schema.py --binary target/debug/examples/library_workout

      - name: Check frozen analytic curve-family controls
        run: python3 tests/scripts/curve_family_reference.py check

      - name: Check complete supplied curve-family inputs
        run: python3 tests/scripts/library_curve_family_inputs.py

      - name: Check native full curve families and JSON C MCP WASM parity
        run: cargo test --locked -p convex-curves --all-features --test curve_families -p convex --test library_curve_families -p convex-ffi --test library_curve_families -p convex-mcp --test library_curve_families -p convex-wasm --test library_curve_families

      - name: Run curve-family consumer with default features
        run: cargo run --locked -p convex --example library_curve_families

      - name: Run curve-family consumer with minimal features
        run: cargo run --locked -p convex --example library_curve_families --no-default-features

      - name: Run curve-family consumer with schema support
        run: cargo run --locked -p convex --example library_curve_families --features schemars

      - name: Validate actual complete curve-family schema
        run: /tmp/convex-library-schema/bin/python tests/scripts/library_curve_families_schema.py --binary target/debug/examples/library_curve_families

      - name: Check native rate-helper guards and JSON C MCP WASM reachability
        run: cargo test --locked -p convex-analytics --all-features --test rate_helper_repricing -p convex --test library_rate_helpers -p convex-ffi --test library_rate_helpers -p convex-mcp --test library_rate_helpers -p convex-wasm --test library_rate_helpers

      - name: Check native CDS-helper guards and JSON C MCP WASM reachability
        run: cargo test --locked -p convex-analytics --all-features --test credit_helper_repricing -p convex --test library_credit_helpers -p convex-ffi --test library_credit_helpers -p convex-mcp --test library_credit_helpers -p convex-wasm --test library_credit_helpers

      - name: Check native cash-helper guards and JSON C MCP WASM reachability
        run: cargo test --locked -p convex-analytics --all-features --test cash_helper_repricing -p convex --test library_cash_helpers -p convex-ffi --test library_cash_helpers -p convex-mcp --test library_cash_helpers -p convex-wasm --test library_cash_helpers

      - name: Run full rate-helper consumer with default features
        run: cargo run --locked -p convex --example library_rate_helpers

      - name: Run full CDS-helper consumer with default features
        run: cargo run --locked -p convex --example library_credit_helpers

      - name: Run full cash-helper consumer with default features
        run: cargo run --locked -p convex --example library_cash_helpers

      - name: Run full rate-helper consumer with minimal features
        run: cargo run --locked -p convex --example library_rate_helpers --no-default-features

      - name: Run full CDS-helper consumer with minimal features
        run: cargo run --locked -p convex --example library_credit_helpers --no-default-features

      - name: Run full cash-helper consumer with minimal features
        run: cargo run --locked -p convex --example library_cash_helpers --no-default-features

      - name: Run full rate-helper consumer with schema support
        run: cargo run --locked -p convex --example library_rate_helpers --features schemars

      - name: Run full CDS-helper consumer with schema support
        run: cargo run --locked -p convex --example library_credit_helpers --features schemars

      - name: Run full cash-helper consumer with schema support
        run: cargo run --locked -p convex --example library_cash_helpers --features schemars

      - name: Validate complete rate-helper schema
        run: /tmp/convex-library-schema/bin/python tests/scripts/library_rate_helpers_schema.py --binary target/debug/examples/library_rate_helpers

      - name: Validate complete CDS-helper schema
        run: /tmp/convex-library-schema/bin/python tests/scripts/library_credit_helpers_schema.py --binary target/debug/examples/library_credit_helpers

      - name: Validate complete cash-helper schema
        run: /tmp/convex-library-schema/bin/python tests/scripts/library_cash_helpers_schema.py --binary target/debug/examples/library_cash_helpers

      - name: Check signed risk libraries and consumers with strict lint
        run: cargo clippy --locked -p convex-curves -p convex-analytics -p convex-portfolio -p convex --all-targets --all-features -- -D warnings

      - name: Run standalone signed quote risk consumer
        run: cargo run --locked -p convex --example quote_risk

      - name: Run signed quote risk without default features
        run: cargo run --locked -p convex --example quote_risk --no-default-features

      - name: Run signed quote risk with schema features
        run: cargo run --locked -p convex --example quote_risk --features schemars

      - name: Run standalone signed portfolio coverage consumer
        run: cargo run --locked -p convex-portfolio --example signed_risk

      - name: Check required signed risk affected suites
        run: cargo test --locked -p convex-analytics -p convex-portfolio -p convex-curves

      - name: Check graph generation and concurrent claims
        run: cargo test --locked -p convex-engine --test graph_regressions

      - name: Build the optimized host ABI with unwind
        run: cargo build --locked --profile excel -p convex-ffi

      - name: Exercise optimized cdylib through C ABI in a subprocess
        run: python3 tools/assurance/abi_smoke.py

  offline-comparison:
    name: Offline Quantitative Comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check fixture pins and complete manifests
        run: python3 reconciliation/comparison.py check

      - name: Prove comparison failures cannot be waived
        run: python3 -m unittest discover -s reconciliation -p "test_comparison.py"

      - name: Build standalone pure analytics adapter
        run: cargo build --locked -p convex-analytics --example offline_compare

      # Out-of-tolerance rows remain a failed gate; never ignore this exit.
      - name: Replay retained QuantLib expectations without live data
        run: python3 reconciliation/comparison.py run --candidate-binary target/debug/examples/offline_compare --report comparison-report.json

      - name: Check supplied swap capture controls
        run: python3 -m unittest discover -s tests/scripts -p test_swap_quantlib_compare.py

      - name: Build supplied swap comparison adapter
        run: cargo build --locked -p convex --example swap_comparison

      - name: Compare supplied swaps against captured QuantLib without live data
        run: python3 tests/scripts/swap_quantlib_compare.py offline --candidate-binary target/debug/examples/swap_comparison --report swap-comparison-report.json

      - name: Check original CDS capture precision and failure controls
        run: python3 -m unittest discover -s tests/scripts -p test_isda_cds_compare.py

      - name: Build standalone native CDS comparison
        run: cargo build --locked -p convex-credit --example cds_comparison

      - name: Compare CDS with the original ISDA RFR grid without live data
        run: python3 tests/scripts/isda_cds_compare.py offline --candidate-binary target/debug/examples/cds_comparison --report cds-comparison-report.json

      - name: Check credit calibration capture and risk failure controls
        run: python3 -m unittest discover -s tests/scripts -p test_isda_credit_compare.py

      - name: Build standalone native credit calibration comparison
        run: cargo build --locked -p convex-analytics --example credit_comparison

      - name: Compare credit calibration and risk with original ISDA execution
        run: python3 tests/scripts/isda_credit_compare.py offline --candidate-binary target/debug/examples/credit_comparison --report credit-comparison-report.json

      - name: Upload offline comparison report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-comparison-report
          path: comparison-report.json
          retention-days: 14

      - name: Upload supplied swap comparison report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supplied-swap-comparison-report
          path: |
            swap-comparison-report.json
            swap-comparison-report-native.stdout
            swap-comparison-report-native.stderr
          retention-days: 14

      - name: Upload supplied CDS comparison report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supplied-cds-comparison-report
          path: |
            cds-comparison-report.json
            cds-comparison-report-native.stdout
            cds-comparison-report-native.stderr
          retention-days: 14

      - name: Upload supplied credit comparison report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supplied-credit-comparison-report
          path: |
            credit-comparison-report.json
            credit-comparison-report-native.stdout
            credit-comparison-report-native.stderr
          retention-days: 14

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all-features --workspace -- --test-threads=1

  production-regressions:
    name: Production Readiness Regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      # CVX-001 records known failures; their owning tasks must repair them.
      # No continue-on-error: this job is a failing production gate until then.
      - name: Check production behavior including known failures
        env:
          CONVEX_PRODUCTION_PROBES: '1'
        run: cargo test --locked -p convex-server --test api_integration_tests production_readiness_ -- --include-ignored --test-threads=1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --locked --all-features --workspace -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --locked --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: -Dwarnings

  package-check:
    name: Package Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check convex-core can be packaged
        run: cargo package --locked -p convex-core --list

  excel-addin:
    name: Excel Add-in (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      # `excel` profile = panic=unwind; see [profile.excel] in Cargo.toml.
      - name: Build convex-ffi
        run: cargo build --locked --profile excel -p convex-ffi -p convex --lib --example library_workflow --features convex/schemars

      - name: Build supplemental native operation consumer
        run: cargo build --locked --profile excel -p convex --example library_operations --features schemars

      - name: Build native full cash quotation consumer
        run: cargo build --locked --profile excel -p convex --example library_cash --features schemars

      - name: Build native full rate-helper quotation consumer
        run: cargo build --locked --profile excel -p convex --example library_rate_helpers --features schemars

      - name: Build native full CDS-helper quotation consumer
        run: cargo build --locked --profile excel -p convex --example library_credit_helpers --features schemars

      - name: Build native full cash-helper quotation consumer
        run: cargo build --locked --profile excel -p convex --example library_cash_helpers --features schemars

      - name: Build native complete workout consumer
        run: cargo build --locked --profile excel -p convex --example library_workout --features schemars

      - name: Build native complete curve-family consumer
        run: cargo build --locked --profile excel -p convex --example library_curve_families --features schemars

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Excel Add-in
        run: dotnet build excel/Convex.Excel/Convex.Excel.csproj --configuration Release

      - name: Stage native DLL for actual P/Invoke parity
        run: |
          New-Item -ItemType Directory -Force -Path excel/Convex.Excel.Tests/bin/Release/net472
          Copy-Item target/excel/convex_ffi.dll excel/Convex.Excel.Tests/bin/Release/net472/
        shell: pwsh

      - name: Generate fresh native P/Invoke expectations
        run: python tests/scripts/library_parity.py prepare --binary target/excel/examples/library_workflow.exe --output excel/Convex.Excel.Tests/bin/Release/net472/library-parity.json

      - name: Generate fresh native P/Invoke operation expectations
        run: python tests/scripts/library_operations_parity.py prepare --binary target/excel/examples/library_operations.exe --output excel/Convex.Excel.Tests/bin/Release/net472/library-operations-parity.json

      - name: Generate fresh native P/Invoke full cash expectations
        run: python tests/scripts/library_cash_parity.py prepare --binary target/excel/examples/library_cash.exe --output excel/Convex.Excel.Tests/bin/Release/net472/library-cash-parity.json

      - name: Generate fresh native P/Invoke full rate-helper expectations
        run: python tests/scripts/library_rate_helpers_parity.py prepare --binary target/excel/examples/library_rate_helpers.exe --output excel/Convex.Excel.Tests/bin/Release/net472/library-rate-helpers-parity.json

      - name: Generate fresh native P/Invoke full CDS-helper expectations
        run: python tests/scripts/library_credit_helpers_parity.py prepare --binary target/excel/examples/library_credit_helpers.exe --output excel/Convex.Excel.Tests/bin/Release/net472/library-credit-helpers-parity.json

      - name: Generate fresh native P/Invoke full cash-helper expectations
        run: python tests/scripts/library_cash_helpers_parity.py prepare --binary target/excel/examples/library_cash_helpers.exe --output excel/Convex.Excel.Tests/bin/Release/net472/library-cash-helpers-parity.json

      - name: Generate fresh native P/Invoke workout expectations
        run: python tests/scripts/library_workout_parity.py prepare --binary target/excel/examples/library_workout.exe --output excel/Convex.Excel.Tests/bin/Release/net472/library-workout-parity.json

      - name: Generate fresh native P/Invoke curve-family expectations
        run: python tests/scripts/library_curve_families_parity.py prepare --binary target/excel/examples/library_curve_families.exe --output excel/Convex.Excel.Tests/bin/Release/net472/library-curve-families-parity.json

      - name: Test Excel Add-in (headless and native P/Invoke)
        run: dotnet test excel/Convex.Excel.Tests/Convex.Excel.Tests.csproj --configuration Release

      - name: Copy native DLL
        run: copy target\excel\convex_ffi.dll excel\Convex.Excel\bin\Release\net472\

      - name: Create Add-in Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path convex-excel-addin
          Copy-Item excel\Convex.Excel\bin\Release\net472\Convex.Excel64.xll convex-excel-addin\
          Copy-Item excel\Convex.Excel\bin\Release\net472\convex_ffi.dll convex-excel-addin\
          if (Test-Path excel\ConvexDemo.xlsx) {
            Copy-Item excel\ConvexDemo.xlsx convex-excel-addin\
          }
          @"
          Convex Excel Add-in
          ===================

          Installation:
          1. Extract all files to a folder
          2. Open Excel
          3. File > Options > Add-ins > Go > Browse
          4. Select Convex.Excel64.xll

          Note: convex_ffi.dll must be in the same folder as the .xll file
          "@ | Out-File -FilePath convex-excel-addin\README.txt -Encoding UTF8

      - name: Upload Add-in Artifact
        uses: actions/upload-artifact@v7
        with:
          name: convex-excel-addin
          path: convex-excel-addin/
          retention-days: 30
